<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSRS TCG Wiki Tracker</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>OSRS TCG Wiki Tracker</h1>
    <p class="intro">Show whether cards are unlocked on OSRS Wiki pages using a public album.</p>

    <label>
      Public album name
      <input id="album" type="text" value="FoilsGold" autocomplete="off" spellcheck="false">
    </label>

    <label>
      Refresh interval
      <select id="refreshMinutes">
        <option value="15">Every 15 minutes</option>
        <option value="20">Every 20 minutes</option>
        <option value="30">Every 30 minutes</option>
      </select>
    </label>

    <div class="actions">
      <button id="save" type="button">Save</button>
      <button id="refresh" class="secondary" type="button">Refresh now</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
